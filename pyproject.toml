[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ddo-vmm-allocator"
version = "0.1.0"
description = "DDO CUDA VMM allocator primitives for demand-paged model weights"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "DDO contributors" }]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
cuda = ["cuda-python>=13.0"]
torch = ["cuda-python>=13.0", "torch>=2.8"]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/ddo_vmm_allocator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "vmm: hardware-backed CUDA VMM integration test",
]
